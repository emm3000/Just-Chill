# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# detekt 2.0.0-alpha.6 analyses INSIDE this daemon: `detekt.use.worker.api` defaults to false, so
# `Detekt.check` takes its `DetektInvoker` branch and every detekt task in `qualityGate` has no heap
# but this one. What they need is allocation room, not live room: a forced full GC at the busiest
# point of `qualityGate --rerun-tasks` leaves 2611M live, and G1's own compaction pauses recover to
# 1047-1918M. At 4096m the gate died with `OutOfMemoryError: Java heap space` on 2 of 3 runs; at
# 6144m G1 compacts once or twice per run on a 10-core host and never runs out; 8192m never
# compacted and did not fit the 16 GB `ubuntu-latest` runner beside the two Kotlin daemons.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# The Kotlin daemon inherits `org.gradle.jvmargs` when this is unset, and detekt does not run in it.
# Forced-GC sampling across the gate puts this daemon's live peak at 747M. It is not the only one:
# `build-logic` runs a second Kotlin daemon and carries its own file, because an included build
# never reads this one and the two cannot merge — a Kotlin daemon's identity is its compiler
# classpath, and that build compiles with Gradle 9.7.1's embedded Kotlin 2.4.0 against this 2.4.10.
kotlin.daemon.jvmargs=-Xmx2048m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true
org.gradle.configuration-cache=true
# Build cache: lets CI reuse task outputs across runs (setup-gradle persists
# ~/.gradle/caches) instead of recompiling all modules cold on every push, and
# speeds up local branch switches. Compile, detekt, test and R8 are all cacheable.
org.gradle.caching=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.usesSdkInManifest.disallowed=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false