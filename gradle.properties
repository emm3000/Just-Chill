# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# detekt 2.0.0-alpha.6 analyses INSIDE this daemon: `detekt.use.worker.api` defaults to false, so
# `Detekt.check` takes its `DetektInvoker` branch and every detekt task in `qualityGate` has no heap
# but this one. They peaked at 4078M against the previous 4096m and died with `OutOfMemoryError:
# Java heap space` in whichever task reached the ceiling first.
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# The Kotlin daemon inherits `org.gradle.jvmargs` when this is unset, and detekt does not run in it:
# without this pin the raise above hands 8g to a second JVM, and two such caps do not fit the 16 GB
# `ubuntu-latest` runner all three workflows call `qualityGate` on. 4096m is what it had before.
kotlin.daemon.jvmargs=-Xmx4096m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true
org.gradle.configuration-cache=true
# Build cache: lets CI reuse task outputs across runs (setup-gradle persists
# ~/.gradle/caches) instead of recompiling all modules cold on every push, and
# speeds up local branch switches. Compile, detekt, test and R8 are all cacheable.
org.gradle.caching=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.usesSdkInManifest.disallowed=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false