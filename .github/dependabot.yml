version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # Gradle catalog (libs.versions.toml). Grouped into one monthly PR that the
  # quality gate validates in CI. Majors are excluded on purpose: AGP/Kotlin/Compose
  # major bumps are migration projects, not routine updates — Dependabot alerts
  # still surface a CVE even when the ignore rule suppresses its update PR.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
