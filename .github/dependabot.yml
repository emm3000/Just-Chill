version: 2
updates:
  # The github-actions ecosystem scans `.github/workflows` plus a ROOT `action.yml` only, so the
  # composite action was never covered and `actions/setup-java` sat a full major behind unnoticed.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup-android"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # Gradle catalog (libs.versions.toml). Grouped into one monthly PR that the
  # quality gate validates in CI. Majors are excluded on purpose: AGP/Kotlin/Compose
  # major bumps are migration projects, not routine updates — Dependabot alerts
  # still surface a CVE even when the ignore rule suppresses its update PR.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
