name: Setup Android Build Environment
description: Decode secrets, configure JDK 17 and Gradle with caching. Caller must checkout first.

inputs:
  # Both signing inputs are optional on purpose. Only the job that publishes needs them; a job that
  # validates does not, and a Dependabot-triggered run cannot have them at all (GitHub keeps repo
  # secrets away from Dependabot). Passing them everywhere put the release key in jobs that never
  # sign, and writing the file unconditionally left an EMPTY keystore.properties that crashed
  # Gradle configuration. Empty input now means "no file", not "a file full of nulls".
  keystore-properties:
    description: Contents of keystore.properties (passed from secrets). When empty, the file is not created and release artifacts are unsigned.
    required: false
    default: ''
  signing-key-base64:
    description: Base64-encoded signing key .p12 file. When empty, no key is decoded.
    required: false
    default: ''
  supabase-properties:
    description: Contents of supabase.properties (passed from secrets). When empty, the file is not created and builds use the non-functional placeholder URL.
    required: false
    default: ''
  cache-read-only:
    description: When true, Gradle cache is read-only (use for PRs to avoid pollution)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Secrets reach the shell through env, never through ${{ }} interpolated into `run:`.
    # Interpolation splices the value into the script text before bash parses it, so any character
    # that means something to bash is executed rather than written.
    - name: Create keystore.properties file
      if: inputs.keystore-properties != ''
      shell: bash
      env:
        KEYSTORE_PROPERTIES: ${{ inputs.keystore-properties }}
      run: printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties

    - name: Create supabase.properties file
      if: inputs.supabase-properties != ''
      shell: bash
      env:
        SUPABASE_PROPERTIES: ${{ inputs.supabase-properties }}
      run: printf '%s\n' "$SUPABASE_PROPERTIES" > supabase.properties

    - name: Decode signing key
      if: inputs.signing-key-base64 != ''
      shell: bash
      env:
        SIGNING_KEY_BASE64: ${{ inputs.signing-key-base64 }}
      run: |
        mkdir -p key
        printf '%s\n' "$SIGNING_KEY_BASE64" | base64 --decode > key/just_chill_key.p12

    - name: Set Up JDK
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: '17'

    # Pinned to a commit, not a floating tag. setup-gradle wraps every Gradle invocation in every
    # job, including the ones holding the signing key and the Play service account, and a floating
    # tag can be repointed at new code by whoever controls the upstream repo.
    # Dependabot (.github/dependabot.yml) proposes the bumps.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
