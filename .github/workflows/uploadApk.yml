name: Android Action Generated APKs

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

# A newer trunk push supersedes the build being distributed; only the latest reaches testers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate and distribute in one job. They were split, but the second job re-ran the same setup and
  # the same Gradle configuration only to assemble what it could not have assembled in parallel
  # anyway — it needed the gate to pass first.
  #
  # The gate runs here on every trunk push even though `scripts/justchill-ci` already gated the PR
  # head locally: protection is `strict: false`, so two PRs green on their own can break trunk
  # together, admin direct pushes skip the PR check, and the `local-gate` status is only as honest
  # as whoever posted it. This is the only GitHub-hosted run of the gate. Do not remove it.
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the commit count and versionName the latest v* tag, both read from git
          # at configure time. A shallow clone silently produces wrong values for both.
          fetch-depth: 0

      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          supabase-properties: ${{ secrets.SUPABASE_PROPERTIES }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # lintDevDebug rides in the same call rather than on the gate: it is the slowest thing the PR
      # gate used to run, and a failure here fails this job exactly as a gate task would.
      - name: Quality gate
        run: ./gradlew qualityGate lintDevDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          if-no-files-found: error
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-sarif
          path: '**/build/reports/detekt/detekt.sarif'
          retention-days: 7

      # The Crashlytics mapping upload is off unless the property is true: trunk only.
      - name: Build APKs
        env:
          MAPPING_UPLOAD: ${{ github.ref == 'refs/heads/trunk' }}
        run: ./gradlew assembleDevDebug assembleProdRelease "-Pjustchill.crashlyticsMappingUpload=$MAPPING_UPLOAD"

      - name: Set current date
        run: echo "date_today=$(date +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Resolve release notes
        id: notes
        run: echo "msg=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Resolve APK paths
        id: paths
        run: |
          echo "devDebug=$(find androidApp/build/outputs/apk/dev/debug -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "prodRelease=$(find androidApp/build/outputs/apk/prod/release -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      # firebase-tools receives the Firebase service credentials, so its whole dependency tree is
      # pinned by the committed lockfile in .github/firebase, integrity hashes included. An exact
      # npx version would pin only the top package and re-resolve the ranged transitive tree on
      # every run. Dependabot (.github/dependabot.yml) proposes the bumps.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/firebase/package-lock.json

      - name: Install firebase-tools
        working-directory: .github/firebase
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Write Firebase credentials
        env:
          CREDENTIALS: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
        run: |
          umask 077
          printf '%s' "$CREDENTIALS" > "$RUNNER_TEMP/firebase-credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-credentials.json" >> "$GITHUB_ENV"

      - name: Distribute Dev Debug to Firebase
        working-directory: .github/firebase
        env:
          APP_ID: ${{ secrets.FIREBASE_DEV_APP_ID }}
          APK: ${{ github.workspace }}/${{ steps.paths.outputs.devDebug }}
          NOTES: ${{ steps.notes.outputs.msg }}
        run: npx --no-install firebase appdistribution:distribute "$APK" --app "$APP_ID" --groups EMM --release-notes "$NOTES" --non-interactive

      - name: Distribute Prod Release to Firebase
        working-directory: .github/firebase
        env:
          APP_ID: ${{ secrets.FIREBASE_PROD_APP_ID }}
          APK: ${{ github.workspace }}/${{ steps.paths.outputs.prodRelease }}
          NOTES: ${{ steps.notes.outputs.msg }}
        run: npx --no-install firebase appdistribution:distribute "$APK" --app "$APP_ID" --groups EMM --release-notes "$NOTES" --non-interactive

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-credentials.json"

      - name: Upload Dev Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.date_today }}-dev-debug-apk
          path: androidApp/build/outputs/apk/dev/debug/
          retention-days: 14

      - name: Upload Prod Release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.date_today }}-prod-release-apk
          path: androidApp/build/outputs/apk/prod/release/
          retention-days: 14
