name: Android Action

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          supabase-properties: ${{ secrets.SUPABASE_PROPERTIES }}
          cache-read-only: 'true'

      - name: Run Lint
        run: ./gradlew lintDevDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-devDebug.html
          retention-days: 7

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          supabase-properties: ${{ secrets.SUPABASE_PROPERTIES }}
          cache-read-only: 'true'

      - name: Run tests
        run: ./gradlew :domain:testAndroidHostTest :data:testAndroidHostTest :androidApp:testDevDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            domain/build/reports/tests/testAndroidHostTest/
            data/build/reports/tests/testAndroidHostTest/
            androidApp/build/reports/tests/testDevDebugUnitTest/
          retention-days: 7

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          supabase-properties: ${{ secrets.SUPABASE_PROPERTIES }}
          cache-read-only: 'true'

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: |
            androidApp/build/reports/detekt/
            data/build/reports/detekt/
            domain/build/reports/detekt/
          retention-days: 7

  build:
    needs: [ lint, unit-test, detekt ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          supabase-properties: ${{ secrets.SUPABASE_PROPERTIES }}
          cache-read-only: 'true'

      - name: Build Dev Debug + Prod Release
        run: ./gradlew assembleDevDebug assembleProdRelease
