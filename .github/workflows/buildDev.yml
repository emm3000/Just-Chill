name: Android Action

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          cache-read-only: 'true'

      - name: Run Lint
        run: ./gradlew lintDevDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-devDebug.html
          retention-days: 7

  unit-test:
    needs: [ lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          cache-read-only: 'true'

      - name: Run tests
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDevDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            domain/build/reports/tests/test/
            data/build/reports/tests/testDebugUnitTest/
            app/build/reports/tests/testDevDebugUnitTest/
          retention-days: 7

  build:
    needs: [ unit-test ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}
          cache-read-only: 'true'

      - name: Build Dev Debug + Prod Release
        run: ./gradlew assembleDevDebug assembleProdRelease
