name: Android Action

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions:
  contents: read

jobs:
  # One job, one Gradle invocation. This used to be three jobs (lint / unit-test / detekt), each
  # with its own hand-written task list, and all three had drifted from the pre-push hook and from
  # the gate documented in docs/WORKFLOW.md. `qualityGate` is defined once in build-logic
  # (QualityGateConventionPlugin) and is the same thing the hook runs, so the lists cannot diverge.
  #
  # The assemble tasks were folded in for the reason that collapsed the gate in the first place: a
  # second job buys a second runner boot, a second cache restore and a second Gradle configuration
  # to run tasks that a single invocation would have scheduled — and it cannot overlap, because it
  # needs the gate to pass first. Gradle already parallelises tasks within one invocation.
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the commit count and versionName the latest v* tag, both read from git
          # at configure time. A shallow clone silently produces wrong values for both.
          fetch-depth: 0

      # No signing credentials here. assembleProdRelease still runs R8, resource shrinking, manifest
      # merging and lint — everything that can actually break — and only skips the final signing
      # step, which proves nothing about the code. Withholding the key keeps it out of every
      # PR-triggered run and is what lets Dependabot PRs pass at all: GitHub gives them no repo
      # secrets, so any job that REQUIRES one can never go green.
      # supabase-properties stays: the anon key is embedded in the shipped client by design, so it
      # is public, and populating it keeps the gate closer to a real build.
      - uses: ./.github/actions/setup-android
        with:
          supabase-properties: ${{ secrets.SUPABASE_PROPERTIES }}
          cache-read-only: 'true'

      - name: Quality gate + builds
        run: ./gradlew qualityGate assembleDevDebug assembleProdRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            domain/build/reports/tests/testAndroidHostTest/
            data/build/reports/tests/testAndroidHostTest/
            presentation/build/reports/tests/testAndroidHostTest/
            ui-android/build/reports/tests/testAndroidHostTest/
            androidApp/build/reports/tests/testDevDebugUnitTest/
          retention-days: 7

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: |
            androidApp/build/reports/detekt/
            ui-android/build/reports/detekt/
            presentation/build/reports/detekt/
            data/build/reports/detekt/
            domain/build/reports/detekt/
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-devDebug.html
          retention-days: 7
