name: Android Action

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions:
  contents: read

jobs:
  # Decides what the PR needs. A manual dispatch sets both outputs true, an empty diff sets `code`
  # true, and a failure here makes quality-gate run with every build; otherwise the diff decides.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"
          code=false
          release=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|docs/*|.claude/*|scripts/justchill-*|.github/dependabot.yml) ;;
              *) code=true ;;
            esac
            case "$file" in
              *.pro|build-logic/convention/src/main/kotlin/com/emm/buildlogic/AndroidReleaseConventionPlugin.kt) release=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # The required check. Skipped (which GitHub counts as passing) only when `changes` succeeded and
  # found docs and agent files alone; any other outcome of `changes` runs it.
  quality-gate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the commit count and versionName the latest v* tag, both read from git
          # at configure time. A shallow clone silently produces wrong values for both.
          fetch-depth: 0

      # No signing credentials here: Dependabot PRs get no repo secrets, so a job that requires one
      # never goes green. The supabase anon key ships in the client by design, so it is public.
      - uses: ./.github/actions/setup-android
        with:
          supabase-properties: ${{ secrets.SUPABASE_PROPERTIES }}
          cache-read-only: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # No assembleDevDebug while the ADR 015 migration runs: the gate already compiles that
      # variant through `testDevDebugUnitTest`, and packaging it gated nothing. It type-checks the
      # prodRelease variant too, through the `compileProdReleaseKotlin` that module names on the
      # gate. assembleProdRelease (R8, resource shrinking, release lint) still runs when the PR
      # touches an R8 keep-rule file or the release convention plugin, or when `changes` could not
      # tell.
      - name: Quality gate + builds
        env:
          RELEASE: ${{ needs.changes.result != 'success' || needs.changes.outputs.release != 'false' }}
        run: |
          tasks=(qualityGate)
          if [ "$RELEASE" = "true" ]; then tasks+=(assembleProdRelease); fi
          ./gradlew "${tasks[@]}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          if-no-files-found: error
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-sarif
          path: '**/build/reports/detekt/detekt.sarif'
          retention-days: 7
