name: Storage RLS Probe

# qualityGate cannot see a SQL policy — it runs with no Docker and no network, and every `backups`
# policy lives in Postgres. This workflow is where that check runs instead, and the reason it is a
# workflow of its own rather than a gate task: it needs a booted Supabase stack.
#
# Path-filtered, because the thing it proves only moves when supabase/ moves.
on:
  pull_request:
    branches:
      - trunk
    paths:
      - 'supabase/**'
      - '.github/workflows/probeStorageRls.yml'
  push:
    branches:
      - trunk
    paths:
      - 'supabase/**'
      - '.github/workflows/probeStorageRls.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # supabase/config.toml enables the Google provider and reads its client id from the
    # environment. This job signs in nobody through Google, so no real client id belongs here — but
    # an unset one is not a value gotrue is guaranteed to boot with. The placeholder is not a
    # secret and must not become one.
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: rls-probe-placeholder.apps.googleusercontent.com
    steps:
      # No fetch-depth here: nothing in this job reads a version out of git.
      - uses: actions/checkout@v7

      # Pinned to a commit, not a floating tag — the same rule the other workflows follow for
      # third-party actions; GitHub's own actions/* stay on tags. Dependabot proposes the bumps.
      # The CLI version is pinned as well: floating it turns an unrelated upstream release into a
      # red run on a change that touched nothing here.
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.100.0

      # Only the gateway, db, auth and storage matter here; the rest is boot time. A fresh start
      # applies supabase/migrations, so the bucket and its three policies come from the same file
      # the hosted project runs.
      - name: Start the local stack
        run: supabase start -x realtime,imgproxy,studio,edge-runtime,vector

      # No secrets: the probe reads the stack's well-known local keys out of `supabase status`.
      - name: Probe the backups bucket
        run: ./supabase/tests/backups-rls-probe.sh

      - name: Stack diagnostics
        if: failure()
        run: |
          docker ps -a
          # Container names carry config.toml's project_id.
          docker logs --tail 100 supabase_auth_JustChill || true
          docker logs --tail 100 supabase_storage_JustChill || true
