name: Upload to Play Store

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}

      - name: Run tests + lint
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDevDebugUnitTest lintProdRelease

  publish:
    needs: [ verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-android
        with:
          keystore-properties: ${{ secrets.JUST_VERONICA }}
          signing-key-base64: ${{ secrets.JUST_CHILL }}

      - name: Build Prod Release Bundle
        run: ./gradlew bundleProdRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: prod-release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/prodRelease/
          retention-days: 90

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.emm.justchill
          releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          status: completed
          track: alpha
          releaseName: ${{ github.ref_name }}
