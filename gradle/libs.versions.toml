[versions]
activityCompose = "1.13.0"
# SQLDelight: gradle plugin + all four drivers/extensions share this version.
sqldelight = "2.3.2"
appcompat = "1.7.1"
composeBom = "2026.06.01"
coreKtx = "1.19.0"
firebaseBom = "34.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
androidxTestRunner = "1.7.0"
koinBom = "4.2.2"
kotlinxDatetime = "0.8.0"
kotlinxCoroutinesCore = "1.11.0"
kotlinxCoroutinesTest = "1.11.0"
kotlinxSerializationJson = "1.11.0"
lifecycleLivedataKtx = "2.11.0"
material = "1.14.0"
mockk = "1.14.11"
navigationCompose = "2.9.8"
androidApplication = "9.3.1"
credentialsVersion = "1.6.0"
googleIdentityVersion = "1.2.0"
kotlinVersion = "2.4.10"
googleServicesVersion = "4.5.0"
googleCrashlyticsVersion = "3.0.7"
detekt = "2.0.0-alpha.6"
composeRulesDetekt = "0.6.4"
supabaseBom = "3.7.0"
ktorClientOkhttp = "3.5.2"

# multiplatform-settings: the standard KMP key-value preferences abstraction. Backs AppPreferences
# in ui-android commonMain (SharedPreferences on Android, NSUserDefaults on iOS). Latest stable 1.x.
multiplatformSettings = "1.3.0"

# KMP / Compose Multiplatform (declared in phase 0, applied per-module in later phases).
# Compose MP 1.11.1 is the release built against Kotlin 2.4.0 (see docs/kmp/BASELINE.md); the
# pairing was re-verified against Kotlin 2.4.10 when that bump landed (full gate, iOS leg included).
composeMultiplatform = "1.11.1"
# SKIE rewrites the JustChillKit framework's Swift interface: sealed -> Swift enums, Flow ->
# AsyncSequence, suspend -> async. 0.10.14 officially supports Kotlin 2.0.0-2.4.10.
skie = "0.10.14"
# CMP material3 is versioned independently of the umbrella composeMultiplatform version, so
# Dependabot will keep proposing 1.12.x while composeMultiplatform stays on 1.11.1. HOLD IT HERE:
# material3 1.12.x targets the CMP 1.12 runtime/foundation, and the mismatch compiles clean but can
# fail at runtime (NoSuchMethodError) — the build gate would not catch it. Bump this only together
# with composeMultiplatform. The project reaches for JetBrains' Compose artifacts at all only
# because :ui-android keeps its UI in commonMain; see that module's CLAUDE.md.
composeMaterial3 = "1.11.0-alpha07"
# material-icons-extended is frozen by JetBrains at 1.7.3 (icons no longer updated upstream).
composeMaterialIcons = "1.7.3"

# nav
nav3Core = "1.1.2"
lifecycleViewmodelNav3 = "2.11.0"

# navigation3 UI for BOTH platforms. The "Option A" Android/iOS host split this once described was
# reversed in slice F (186d3b6): one commonMain AppNavHost drives Android and iOS on the JetBrains
# Compose Multiplatform port (org.jetbrains.androidx.navigation3:navigation3-ui). The runtime
# (NavKey, NavBackStack, entryProvider) comes from androidx.navigation3:navigation3-runtime, itself
# multiplatform since 1.0.0-rc01.
jetbrainsNav3Ui = "1.1.1"
nav3RuntimeKmp = "1.1.2"
jetbrainsLifecycleViewmodelNav3 = "2.11.0"

# JetBrains multiplatform lifecycle (ui-android commonMain ViewModel) — aligned with Compose MP 1.11.1.
jetbrainsLifecycle = "2.11.0"

[libraries]
android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
# AndroidJUnitRunner — the instrumentation runner for :data's androidDeviceTest source set.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleLivedataKtx" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# Multiplatform BackHandler — not pulled in transitively by compose-ui; AuthScreen's CheckEmail needs it.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
# CMP 1.10+ multiplatform @Preview (provides androidx.compose.ui.tooling.preview.Preview).
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# @Preview RENDERING in the IDE (not just compilation), per the CMP preview docs.
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
junit = { module = "junit:junit", version.ref = "junit" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBom" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-core = { module = "io.insert-koin:koin-core" }
# viewModelOf/viewModel DSL without compose — :presentation's DI modules use it; koin-compose-viewmodel
# (ui-android) sits on top of it.
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
material = { module = "com.google.android.material:material", version.ref = "material" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
detekt-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabaseBom" }
supabase-auth-kt = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorClientOkhttp" }
# iOS engine — pinned to the same Ktor version as the OkHttp (Android) engine.
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktorClientOkhttp" }
# iOS SQLDelight driver — same SQLDelight version as the Android driver.
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

# multiplatform-settings — KMP key-value store behind AppPreferences (commonMain). Provides the
# common Settings interface plus SharedPreferencesSettings (Android) and NSUserDefaultsSettings (iOS).
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
# Official in-memory Settings double (MapSettings) from the same release train. Test-only: it backs
# the fake platform module of the ui-android Koin graph test, so no SharedPreferences/Context is needed.
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatformSettings" }
# Already on the RUNTIME classpath transitively (supabase-kt's Auth plugin builds its default
# SettingsSessionManager through the no-arg Settings() factory). Declared explicitly for host tests
# only, to compile-reference SettingsInitializer — the library's documented hook for supplying the
# Android Context that androidx.startup provides in a real app but not in a JVM unit test.
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }

androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentialsVersion" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentialsVersion" }
google-identity-googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleIdentityVersion" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleLivedataKtx" }

# JetBrains multiplatform lifecycle-viewmodel — provides ViewModel + viewModelScope in commonMain (ui-android).
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
# Compose-free variant for :presentation — same ViewModel/viewModelScope without the compose runtime.
jetbrains-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jetbrainsLifecycle" }

# navigation3 UI + viewmodel for the unified commonMain nav host (Android AND iOS, since slice F).
# Runtime comes from androidx-navigation3-runtime above; these are the JetBrains CMP ports.
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jetbrainsNav3Ui" }
jetbrains-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "jetbrainsLifecycleViewmodelNav3" }

[plugins]

android-application = { id = "com.android.application", version.ref = "androidApplication" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesVersion" }
google-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "googleCrashlyticsVersion" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }
# Generates KSerializer for @Serializable nav routes and sync DTOs. Applied by :androidApp, :data, :ui-android.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinVersion" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

# KMP / Compose Multiplatform plugins (declared in phase 0, applied per-module later).
# composeCompiler reuses the existing `kotlin-compose` alias (org.jetbrains.kotlin.plugin.compose).
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinVersion" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidApplication" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# Applied by :presentation alone — the module that publishes the JustChillKit framework.
skie = { id = "co.touchlab.skie", version.ref = "skie" }