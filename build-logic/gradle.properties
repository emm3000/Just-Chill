# An included build reads its own gradle.properties, never the root's, so the `kotlin.daemon.jvmargs`
# pin there does not reach this build: without this line `build-logic`'s Kotlin compilation spawns a
# second daemon inheriting `org.gradle.jvmargs`, measured at -Xmx8192m while `:build-logic:*` ran.
kotlin.daemon.jvmargs=-Xmx4096m
