# An included build reads its own gradle.properties, never the root's, so without this line
# `build-logic`'s Kotlin compilation inherits `org.gradle.jvmargs` — measured at -Xmx8192m while
# `:build-logic:*` ran. It cannot borrow the root build's Kotlin daemon either: a daemon's identity
# is its compiler classpath, this build compiles with Gradle 9.7.1's embedded Kotlin 2.4.0 and the
# root build with 2.4.10, and both are alive at once through a whole `qualityGate` run. This one
# only ever compiles the convention plugins: forced-GC sampling puts its live peak at 267M.
kotlin.daemon.jvmargs=-Xmx768m
